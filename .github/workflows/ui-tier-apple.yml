name: UI Tier Apple (Apple toolchain compile)

# 深度层：用与主构建相同的 AppleClang 15.4 / iPhoneOS17.5.sdk / deployment 14.0
# 真编译 Phase0 产物（header-only，最小爆炸面），与上游 main_hook 坏点无关。
on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened, synchronize]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  apple-compile:
    name: UI headers AppleClang check
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Checkout (no submodules needed, headers are SDK-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Syntax-only compile headers + API smoke TU
        run: |
          set -e -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FLAGS="-isysroot $SDK -miphoneos-version-min=14.0 -fobjc-arc -Wunguarded-availability -Werror=unguarded-availability"
          clang -fsyntax-only -x objective-c-header $FLAGS Natives/LauncherRouter.h
          clang -fsyntax-only -x objective-c-header $FLAGS Natives/UITheme.h
          cat > /tmp/ui_smoke.m <<'EOF'
          #import "LauncherRouter.h"
          #import "UITheme.h"
          void ui_refactor_smoke(NSString *name, UIColor *c) {
              RouterPost(kRouterShowHomePage, nil, nil);
              RouterPost(kRouterFindVersionInRemoteList, nil, @{@"k": @"v"});
              RouterPost(kRouterSelectedProfileChanged, name, nil);
              UIColor *d = UIThemeColorFromHex(@"#8B5CF6");
              NSString *h = UIThemeHexFromColor(c ? c : UIColor.clearColor);
              (void)d; (void)h;
          }
          EOF
          clang -fsyntax-only -x objective-c $FLAGS -INatives /tmp/ui_smoke.m
          echo '[tier-apple] headers + API smoke compile passed'
