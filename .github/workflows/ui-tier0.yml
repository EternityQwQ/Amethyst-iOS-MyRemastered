name: UI Tier0 (fast static checks)

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened, synchronize]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  tier0:
    name: UI Tier0 static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Router coverage (every @"Show*"/notify literal has a constant)
        run: |
          set -e
          # 抽取通知字面量，与 LauncherRouter.h 常量值交叉核对
          grep -rho 'postNotificationName:@"[^"]*"\|name:@"[^"]*"' Natives --include='*.m' \
            | grep -o '@"[^"]*"' | tr -d '@"' | sort -u > /tmp/used.txt
          grep -o '"Show[A-Za-z]*"\|"Background[A-Za-z]*"\|"LauncherAppearance[A-Za-z]*"\|"ReloadProfileList"\|"SelectedProfileChanged"\|"UpdateAccountInfo"\|"AccountChanged"\|"InstallModpack"\|"FindVersionInRemoteList"\|"DownloadCenterDidDismiss"\|"UIThemeChanged"\|"OpenCurseForgeAPIKeySettings"' Natives/LauncherRouter.h \
            | tr -d '"' | sort -u > /tmp/covered.txt
          missing=0
          while read -r n; do
            # 仅校验导航/外观/数据三类（系统 UIKit 通知如 UINavigationController... 除外）
            case "$n" in
              Show*|Background*|LauncherAppearance*|ReloadProfileList|SelectedProfileChanged|UpdateAccountInfo|AccountChanged|InstallModpack|FindVersionInRemoteList|DownloadCenterDidDismiss|UIThemeChanged|OpenCurseForgeAPIKeySettings)
                grep -qx "$n" /tmp/covered.txt || { echo "[tier0] Router missing: $n"; missing=1; } ;;
            esac
          done < /tmp/used.txt
          exit $missing

      - name: No secrets in tree (long ghp_ tokens)
        run: |
          set -e
          # 真 token 40 字符；短命中（如 highp_ 误报）用 30+ 长度过滤
          if grep -rE 'ghp_[A-Za-z0-9]{30,}' Natives JavaApp .github Makefile 2>/dev/null; then
            echo '[tier0] possible token leak'; exit 1
          fi
          echo '[tier0] no token leak'

      - name: Header-only guard (no new .m without CMake entry)
        run: |
          set -e
          # Phase0 约定：只允许新增 header；新增 .m 必须同步登记 CMakeLists
          git fetch origin main --depth 1 --filter=blob:none 2>/dev/null || true
          base="origin/main"
          git rev-parse --verify "$base" >/dev/null 2>&1 || base="${{ github.event.before }}"
          for f in $(git diff --name-only "$base" HEAD -- Natives | grep '\.m$' || true); do
            grep -q "$(basename $f)" Natives/CMakeLists.txt || { echo "[tier0] new .m not in CMakeLists: $f"; exit 1; }
          done
          echo '[tier0] header-only guard passed'

      - name: Patch scripts syntax
        run: |
          set -e
          python3 -m py_compile Natives/patch_sfpew_ios.py Natives/patch_mobilegl_ios.py 2>/dev/null || echo '[tier0] patch scripts optional check skipped'
